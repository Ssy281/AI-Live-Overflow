name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleRelease
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass release123 \
            -keypass release123 \
            -dname "CN=AI Live Overflow, OU=Dev, O=AI Live Overflow, L=Beijing, ST=Beijing, C=CN"
      - name: Sign APK with release keystore
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer-1.3.0.jar \
            --apks app/build/outputs/apk/release/app-release-unsigned.apk \
            --ks release.jks \
            --ksAlias release \
            --ksPass release123 \
            --ksKeyPass release123 \
            --allowResign
          cp app/build/outputs/apk/release/app-release-aligned-release.apk app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liveoverflow-apk
          path: app/build/outputs/apk/release/app-release.apk
